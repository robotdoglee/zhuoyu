<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f5" />
    <meta
      name="description"
      content="琢玉：如切如磋，如琢如磨。帮人亲手复现论文的本地优先工作台。"
    />
    <title>琢玉 · 如切如磋，如琢如磨</title>
    <script>
      ;(function () {
        try {
          var redirect = window.sessionStorage.getItem('zhuoyu:spa-redirect')
          if (redirect && redirect.charAt(0) === '/') {
            window.sessionStorage.removeItem('zhuoyu:spa-redirect')
            window.history.replaceState(null, '', redirect)
          }
        } catch {
          // 隐私模式禁用存储时按普通首页打开。
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
